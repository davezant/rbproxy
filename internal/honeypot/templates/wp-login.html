<!DOCTYPE html>
<html lang="en-US">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Log In &lsaquo; {{.Host}} &#8212; WordPress</title>
<meta name="robots" content="max-image-preview:large, noindex, noarchive" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" id="login-css" href="/wp-admin/css/login.min.css?ver=6.4.3" type="text/css" media="all" />
<style>
body.login{background:#f0f0f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px}
#login{width:320px;padding:8% 0 0;margin:auto}
#loginform{background:#fff;border:1px solid #c3c4c7;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:26px 24px 34px;margin-top:20px}
#loginform input[type=text],#loginform input[type=password]{width:100%;font-size:24px;padding:3px 5px;margin:2px 6px 16px 0;box-sizing:border-box}
#login_error{border-left:4px solid #d63638;background:#fff;padding:12px;margin-top:20px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.button-primary{background:#2271b1;border:1px solid #2271b1;color:#fff;padding:0 12px;min-height:32px;border-radius:3px;float:right}
h1 a{display:block;text-align:center;font-size:20px;color:#3c434a;text-decoration:none}
</style>
</head>
<body class="login no-js login-action-login wp-core-ui locale-en-us">
<div id="login">
<h1><a href="https://wordpress.org/">Powered by WordPress</a></h1>
{{if .Error}}<div id="login_error"><strong>Error:</strong> The password you entered for the username <strong>{{.Username}}</strong> is incorrect. <a href="/wp-login.php?action=lostpassword">Lost your password?</a><br /></div>{{end}}
<form name="loginform" id="loginform" action="/wp-login.php" method="post">
<p><label for="user_login">Username or Email Address</label>
<input type="text" name="log" id="user_login" class="input" value="{{.Username}}" size="20" autocapitalize="off" autocomplete="username" required="required" /></p>
<div class="user-pass-wrap"><label for="user_pass">Password</label>
<input type="password" name="pwd" id="user_pass" class="input password-input" value="" size="20" autocomplete="current-password" spellcheck="false" required="required" /></div>
<p class="forgetmenot"><input name="rememberme" type="checkbox" id="rememberme" value="forever" /> <label for="rememberme">Remember Me</label></p>
<p class="submit"><input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In" />
<input type="hidden" name="redirect_to" value="{{if .Redirect}}{{.Redirect}}{{else}}https://{{.Host}}/wp-admin/{{end}}" />
<input type="hidden" name="testcookie" value="1" /></p>
</form>
<p id="nav"><a href="/wp-login.php?action=lostpassword">Lost your password?</a></p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration &middot; {{.Host}}</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#1f2933}
main{max-width:340px;margin:12vh auto;background:#fff;padding:2rem;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:1.25rem;margin:0 0 1.5rem}
label{display:block;font-size:.85rem;margin-bottom:.25rem}
input{width:100%;box-sizing:border-box;padding:.6rem;margin-bottom:1rem;border:1px solid #cbd2d9;border-radius:4px}
button{width:100%;padding:.7rem;border:0;border-radius:4px;background:#1f2933;color:#fff;font-weight:600}
.err{background:#fde8e8;color:#9b1c1c;padding:.6rem;border-radius:4px;font-size:.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<main>
<h1>Sign in to the control panel</h1>
{{if .Error}}<div class="err">Invalid username or password.</div>{{end}}
<form method="post" action="{{.Path}}">
<label for="u">Username</label><input id="u" name="username" value="{{.Username}}" autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
<button type="submit">Sign in</button>
</form>
</main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">RBProxy</title>
  <desc id="d">RBProxy: the reverse proxy that bites back. Detects attacks, profiles clients and grows its own honeypots.</desc>
  <defs>
    <clipPath id="round"><rect width="1200" height="360" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="170" cy="180" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot" cx="170" cy="200" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5a524"/>
      <stop offset="0.55" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" rx="18" fill="#0d1117"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <rect x="0" y="354" width="1200" height="6" fill="url(#edge)" clip-path="url(#round)"/>

  <!-- mark: a hive inside a guard hexagon; one cell has been triggered -->
  <g>
    <circle cx="170" cy="180" r="112" fill="none" stroke="#f5a524" stroke-opacity="0.10"/>
    <circle cx="170" cy="180" r="140" fill="none" stroke="#f5a524" stroke-opacity="0.06"/>
    <polygon points="170,98 241,139 241,221 170,262 99,221 99,139" fill="#161b22" stroke="#f5a524" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="151,150 167.45,159.5 167.45,178.5 151,188 134.55,178.5 134.55,159.5" fill="#f5a524"/>
    <polygon points="189.1,150 205.55,159.5 205.55,178.5 189.1,188 172.65,178.5 172.65,159.5" fill="#f5a524" fill-opacity="0.45"/>
    <circle cx="170" cy="202" r="40" fill="url(#hot)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <polygon points="170,183 186.45,192.5 186.45,211.5 170,221 153.55,211.5 153.55,192.5" fill="#ff4d4d"/>
  </g>

  <!-- wordmark -->
  <text x="292" y="176" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5" fill="#e6edf3">RB<tspan fill="#f5a524">Proxy</tspan></text>
  <text x="295" y="218" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#9da7b3">The reverse proxy that bites back.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600">
    <rect x="295" y="244" width="86" height="30" rx="15" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-opacity="0.5"/>
    <text x="338" y="264" text-anchor="middle" fill="#f5a524">detect</text>
    <rect x="391" y="244" width="94" height="30" rx="15" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-opacity="0.5"/>
    <text x="438" y="264" text-anchor="middle" fill="#f5a524">profile</text>
    <rect x="495" y="244" width="94" height="30" rx="15" fill="#ff4d4d" fill-opacity="0.12" stroke="#ff4d4d" stroke-opacity="0.6"/>
    <text x="542" y="264" text-anchor="middle" fill="#ff6b6b">deceive</text>
  </g>

  <!-- terminal -->
  <g transform="translate(680 58)">
    <rect width="480" height="244" rx="10" fill="#010409" stroke="#30363d"/>
    <path d="M0 10a10 10 0 0 1 10-10h460a10 10 0 0 1 10 10v20H0z" fill="#161b22"/>
    <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="15" r="5" fill="#febc2e"/>
    <circle cx="54" cy="15" r="5" fill="#28c840"/>
    <text x="240" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e7681">rbproxy — deceive mode</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
      <text x="16" y="58" fill="#3fb950">$</text><text x="32" y="58" fill="#e6edf3">rbproxy host -t http://127.0.0.1:3000</text>
      <text x="16" y="88" fill="#d29922">MEDIUM</text><text x="100" y="88" fill="#8b949e">pattern</text><text x="216" y="88" fill="#c9d1d9">scanner:nikto</text>
      <text x="16" y="113" fill="#ff7b72">HIGH</text><text x="100" y="113" fill="#8b949e">attack</text><text x="216" y="113" fill="#c9d1d9">sqli (score 9)</text>
      <text x="16" y="138" fill="#d29922">MEDIUM</text><text x="100" y="138" fill="#8b949e">honeypot_hit</text><text x="216" y="138" fill="#c9d1d9">GET /.env → decoy</text>
      <text x="16" y="163" fill="#ff4d4d" font-weight="700">CRITICAL</text><text x="100" y="163" fill="#8b949e">canary_used</text><text x="216" y="163" fill="#c9d1d9">stolen credential reused</text>
      <text x="16" y="188" fill="#ff7b72">HIGH</text><text x="100" y="188" fill="#8b949e">blocked</text><text x="216" y="188" fill="#c9d1d9">threat score 104</text>
      <text x="16" y="220" fill="#3fb950">$</text>
      <rect x="30" y="209" width="8" height="15" fill="#e6edf3">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
